name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite (demo mode, no secrets required)
        env:
          APP_MODE: demo
        run: pytest tests/ -q --cov=nutrimind --cov-report=term
