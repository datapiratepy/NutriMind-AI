name: ci

on:
  push:
  pull_request:

# A second push to the same branch cancels the first — no point paying for a
# run whose result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · tests · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match the version developers use locally and the deployment image.
      # The supported range is 3.11-3.14, set by ibm-watsonx-ai's Requires-Python;
      # 3.13 is the newest with broad, settled support across the whole tree.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Lint before tests: it is far cheaper, so a style or dead-code failure
      # reports in seconds rather than after the whole suite has run.
      - name: Lint (ruff)
        run: ruff check .

      # A ratchet against silent erosion, not a target to chase — that is how
      # coverage always dies, one "I'll add the test later" at a time. Set just
      # below the current 89% so rounding on an unrelated PR cannot block it;
      # raise it when the real number moves up.
      - name: Tests (demo mode, no secrets required)
        env:
          APP_MODE: demo
        run: pytest tests/ -q --cov=nutrimind --cov-report=term --cov-fail-under=88

      # Advisory: a new CVE disclosure is not our regression, and should not
      # block an unrelated PR. It still has to be visible in the run summary.
      - name: Dependency vulnerability audit
        continue-on-error: true
        run: pip-audit --requirement requirements.txt --requirement requirements-dev.txt

  # Development runs on SQLite; production runs on PostgreSQL. This job is what
  # stops that gap from hiding a dialect bug until deployment day.
  #
  # It applies the migrations to a real PostgreSQL server and asserts the result
  # matches the models. Deliberately not the whole suite: the dialect-sensitive
  # surface is the schema, and the agents, routes and retrieval layers behave
  # identically on both. Running all 180+ tests twice would double CI time to
  # re-prove things SQLite already proved.
  postgres:
    name: migrations on postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nutrimind
          POSTGRES_PASSWORD: nutrimind
          POSTGRES_DB: nutrimind_test
        ports:
          - 5432:5432
        # Without a health check the job races the container and fails
        # intermittently, which is worse than failing consistently.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Deliberately the deployment script rather than `flask db upgrade`, so CI
      # exercises the exact command the runbook tells an operator to run.
      - name: Apply migrations to PostgreSQL
        env:
          APP_MODE: demo
          DATABASE_URI: postgresql+psycopg://nutrimind:nutrimind@localhost:5432/nutrimind_test
        run: python scripts/upgrade_database.py

      - name: Assert the PostgreSQL schema matches the models
        env:
          APP_MODE: demo
          DATABASE_URI: postgresql+psycopg://nutrimind:nutrimind@localhost:5432/nutrimind_test
        run: python scripts/check_schema.py

  # The deployment artefacts are code too, and they break the same way anything
  # untested breaks. This job builds the real image and runs the real deployment
  # commands inside it, so a Dockerfile that no longer installs, a wsgi module
  # that no longer imports, or a migration step that fails in the container is a
  # red build rather than a discovery during a deploy.
  docker:
    name: image build · migrations · schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t nutrimind:ci .

      # The container must not run as root. Checked rather than assumed: a
      # stray USER directive or a base-image change can silently undo it.
      - name: Assert the image runs as a non-root user
        run: |
          uid=$(docker run --rm nutrimind:ci id -u)
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
          echo "runtime uid=$uid"

      # Exactly the command docs/RUNBOOK.md tells an operator to run, executed
      # in the image that will actually run it.
      - name: Apply migrations inside the image
        run: |
          docker run --rm -e APP_MODE=demo -e NUTRIMIND_INSTANCE_DIR=/data \
            -e FLASK_SECRET_KEY=ci-not-a-placeholder-value-abcdef123456 \
            -v ci-data:/data nutrimind:ci python scripts/upgrade_database.py

      - name: Assert the schema matches the models inside the image
        run: |
          docker run --rm -e APP_MODE=demo -e NUTRIMIND_INSTANCE_DIR=/data \
            -e FLASK_SECRET_KEY=ci-not-a-placeholder-value-abcdef123456 \
            -v ci-data:/data nutrimind:ci python scripts/check_schema.py

      # Booting is not the same as serving. This starts the real entry point and
      # waits for the health endpoint the container's own HEALTHCHECK uses.
      - name: Boot the container and wait for /api/health
        run: |
          docker run -d --name nutrimind-ci -p 8000:8000 \
            -e APP_MODE=demo -e NUTRIMIND_INSTANCE_DIR=/data \
            -e FLASK_SECRET_KEY=ci-not-a-placeholder-value-abcdef123456 \
            -v ci-data:/data nutrimind:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /tmp/health.json; then
              cat /tmp/health.json; echo; break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health > /dev/null

      # SIGTERM must drain background indexing rather than be ignored. `docker
      # stop` sends SIGTERM and then SIGKILLs after the timeout, so an exit
      # inside the window is the evidence that the handler ran.
      - name: Assert the container stops gracefully on SIGTERM
        run: |
          start=$(date +%s)
          docker stop --timeout 40 nutrimind-ci
          echo "stopped in $(( $(date +%s) - start ))s"
          docker logs nutrimind-ci 2>&1 | tail -20

      - name: Clean up
        if: always()
        run: docker rm -f nutrimind-ci 2>/dev/null || true
